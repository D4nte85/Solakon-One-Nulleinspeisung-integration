titel: Zielladen mit Batterievorrang geht beim Entladen in Fall ZB — Output 0 W im Ruhemodus, bis der Ziel-SOC erreicht ist
bezug: 2026-11-14-architektur-review-10-design
# Instanz a: Zielladen an (Ziel-SOC 80 %, Batterievorrang, kein Netz-Laden), SOC 50 %, Modus 1 mit 300 W.
# Fall ZB setzt den Output auf 0 W, geht in den Ruhemodus (Modus 0) und beendet den Zyklus; die ganze PV lädt die Batterie.
# Bei SOC 80 % greift Fall ZE: Ziel erreicht, Entladepause.
netz: 100
instanzen:
  - prefix: a
    settings: {regulation_enabled: true, target_charge_enabled: true, target_soc: 80,
               target_battery_priority: true, target_grid_charge: false}
    flags: {cycle_active: true}
    sensoren: {soc: 50, solar: 600, modus: "1", leistung: 300, ist: 300}
schritte:
  - nach: 0
  - nach: 30
    setzen: {a.soc: 80}
erwartet:
  - schritt: 1
    aufruf: {entity: a.leistung, wert: 0}
  - schritt: 1
    aufruf: {entity: select.a_mode, wert: "0"}
  - schritt: 1
    instanz: a
    zustand: {active_fall: ZB, last_action_key: act_fall_zb, cycle_active: false, resting: true}
  - schritt: 2
    instanz: a
    zustand: {active_fall: ZE, display.operating_state: discharge_pause}
