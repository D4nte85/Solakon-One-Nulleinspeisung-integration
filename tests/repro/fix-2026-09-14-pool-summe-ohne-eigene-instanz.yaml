titel: Ruhende Instanz übersieht die einzige entladende Schwester und startet AC-Laden
bezug: fix-2026-09-14-pool-summe-ohne-eigene-instanz
# a ruht in Modus 0, b entlädt 800 W in dieselbe Netzgruppe, das Netz zeigt −449 W.
# Ohne b gäbe es Netzbezug von 351 W — kein Überschuss, Fall G darf nicht starten.
netz: -449
instanzen:
  - prefix: a
    settings: {regulation_enabled: true, ac_enabled: true}
    sensoren: {soc: 15, modus: "0", leistung: 0, ist: 0}
  - prefix: b
    settings: {regulation_enabled: true}
    flags: {cycle_active: true}
    sensoren: {soc: 70, modus: "1", leistung: 800, ist: 800}
schritte:
  - nach: 0
    wer: a
erwartet:
  - zustand: {ac_charge_active: false}
  - kein_aufruf: {entity: a.modus, wert: "3"}
