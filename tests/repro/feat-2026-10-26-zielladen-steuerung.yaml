titel: Netz-Laden lädt mit der Netz-Ladeleistung, nicht mit der Max. Ladeleistung des AC-Ladens
bezug: 2026-10-26-zielladen-steuerung-design
# Max. Ladeleistung 400 W, Netz-Ladeleistung auf dem Standard 800 W: Fall GN schreibt 800 W im Modus 3.
netz: 100
instanzen:
  - prefix: a
    settings: {regulation_enabled: true, target_charge_enabled: true, target_soc: 70,
               target_grid_charge: true, ac_power_limit: 400}
    sensoren: {soc: 40, solar: 0, modus: "0"}
schritte:
  - nach: 0
erwartet:
  - schritt: 1
    aufruf: {entity: select.a_mode, wert: "3"}
  - schritt: 1
    aufruf: {entity: a.leistung, wert: 800}
  - schritt: 1
    instanz: a
    zustand: {active_fall: GN, grid_charge_active: true}
