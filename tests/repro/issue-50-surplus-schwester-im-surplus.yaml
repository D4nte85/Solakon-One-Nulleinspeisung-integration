titel: Schwester im Surplus blockiert den Surplus-Eintritt nicht
bezug: issue-50-fall-g-veraltete-ist-leistung
offen: false
# b im Surplus: fester Zone-0-Sollwert 800 W, gibt aber nur 300 W ab (PV-begrenzt).
# a entlädt 100 W, Last 100 W → Netz 100 − 400 = −300 W. a hat 250 W PV und gehört in den Surplus.
netz: -300
instanzen:
  - prefix: a
    settings: {regulation_enabled: true, surplus_enabled: true}
    flags: {cycle_active: true}
    sensoren: {soc: 96, solar: 250, modus: "1", ist: 100, leistung: 100}
    folgt_ist: 0
  - prefix: b
    settings: {regulation_enabled: true, surplus_enabled: true}
    flags: {cycle_active: true, surplus_active: true}
    sensoren: {soc: 96, solar: 300, modus: "1", ist: 300, leistung: 800}
    folgt_ist: 0
schritte:
  - nach: 0
    wer: a
erwartet:
  - schritt: 1
    instanz: a
    zustand: {surplus_active: true}
