titel: Ausfall des Netzsensors überspringt den Zyklus ohne Fehlermeldung
bezug: fix-2026-09-14-sensorausfall-ohne-meldung
# Netzsensor unavailable: der Zyklus darf nichts schreiben, muss aber eine Meldung setzen.
netz: unavailable
instanzen:
  - prefix: a
    settings: {regulation_enabled: true}
    sensoren: {soc: 60, modus: "1", leistung: 300}
schritte:
  - nach: 0
erwartet:
  - kein_aufruf: {entity: a.leistung}
  - kein_aufruf: {entity: a.modus}
  - zustand_nicht: {last_error: ""}
