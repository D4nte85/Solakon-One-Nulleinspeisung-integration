<title>Solakon ONE — Live-Vorschau</title>
<style>
:root {
  color-scheme: dark;
  --primary-color: #03a9f4;
  --primary-background-color: #121212;
  --secondary-background-color: #1c1c1c;
  --card-background-color: #1e1e1e;
  --primary-text-color: #e0e0e0;
  --secondary-text-color: #a0a0a0;
  --divider-color: #333333;
  --app-header-background-color: #03a9f4;
  --app-header-text-color: #ffffff;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --primary-background-color: #fafafa;
    --secondary-background-color: #f0f0f0;
    --card-background-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #666666;
    --divider-color: #dddddd;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--primary-background-color);min-height:100vh}
#scenario-switcher{position:fixed;bottom:12px;right:12px;z-index:1000;display:flex;gap:4px;
  background:var(--card-background-color);border:1px solid var(--divider-color);
  border-radius:8px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-family:sans-serif}
#scenario-switcher button{border:none;border-radius:6px;padding:6px 10px;font-size:.78em;
  cursor:pointer;background:transparent;color:var(--secondary-text-color)}
#scenario-switcher button.active{background:var(--primary-color);color:#fff}
#scenario-switcher button:hover:not(.active){background:var(--secondary-background-color)}
</style>

<!--
  Live-Vorschau: lädt das echte solakon-panel.js unverändert und speist es mit
  Demo-Daten über ein Mock-hass-Objekt. Keine hartkodierte Nachbildung mehr —
  jede Änderung am echten Panel erscheint hier automatisch. Optional ?lang=en
  für die englische Übersetzung (real genutzte panel.en.json), ?scenario=
  wählt eine der drei Instanz-Konfigurationen (siehe Schalter unten rechts).
-->
<solakon-panel id="panel"></solakon-panel>
<div id="scenario-switcher"></div>

<script src="custom_components/solakon_nulleinspeisung/frontend/solakon-panel.js"></script>
<script>
(function () {
  const DOMAIN = "solakon_nulleinspeisung";

  // Das echte Panel fetcht Übersetzungen von einem HA-Static-Path (/<DOMAIN>/panel.xx.json).
  // Hier gibt es keinen HA-Server — auf den repo-relativen Pfad umleiten, damit das
  // sowohl lokal (`python -m http.server`) als auch auf GitHub Pages funktioniert.
  const origFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => {
    if (typeof url === "string" && url.startsWith(`/${DOMAIN}/`)) {
      url = `custom_components/${DOMAIN}/frontend/` + url.slice(DOMAIN.length + 2);
    }
    return origFetch(url, opts);
  };

  const now = () => Math.floor(Date.now() / 1000);

  // Deckt sich mit SETTINGS_DEFAULTS in const.py.
  const DEFAULT_SETTINGS = {
    regulation_enabled: true,
    p_factor: 1.3, i_factor: 0.05, tolerance: 15, wait_time: 3, stddev_window: 60,
    zone1_limit: 50, zone3_limit: 20, discharge_max: 40,
    hard_limit_z0: 800, hard_limit_z1: 800,
    offset_1: 30, offset_2: 10, pv_reserve: 50,
    surplus_enabled: false, surplus_soc_threshold: 95, surplus_soc_hyst: 5, surplus_pv_hyst: 50,
    surplus_forecast_enabled: false, surplus_forecast_threshold: 5000,
    surplus_lock_enabled: false, surplus_lock_sensor: "", surplus_lock_factor: 1.5,
    ac_enabled: false, ac_soc_target: 90, ac_power_limit: 800, ac_hysteresis: 50,
    ac_offset: -50, ac_p_factor: 0.3, ac_i_factor: 0.0,
    tariff_enabled: false, tariff_price_sensor: "", tariff_cheap_threshold: 10, tariff_exp_threshold: 25,
    tariff_soc_target: 90, tariff_power: 800, tariff_cheap_entity: "", tariff_exp_entity: "",
    pv_forecast_enabled: false, pv_forecast_sensor: "", pv_forecast_threshold: 5000,
    zone1_force_enabled: false, zone1_force_sensor: "", zone1_force_threshold: 5000,
    night_enabled: false,
    periodic_enabled: false, periodic_interval: 10,
    self_adjust_enabled: false, self_adjust_tolerance: 2,
    dyn_z1_enabled: false, dyn_z1_min: 30, dyn_z1_max: 250, dyn_z1_noise: 15, dyn_z1_factor: 1.5, dyn_z1_negative: false,
    dyn_z2_enabled: false, dyn_z2_min: 30, dyn_z2_max: 250, dyn_z2_noise: 15, dyn_z2_factor: 1.5, dyn_z2_negative: false,
    dyn_ac_enabled: false, dyn_ac_min: 30, dyn_ac_max: 250, dyn_ac_noise: 15, dyn_ac_factor: 1.5, dyn_ac_negative: false,
  };

  // Szenario-Auswahl für die Live-Vorschau — deckt die drei strukturell
  // unterschiedlichen Panel-Zustände ab: "single" (1 Instanz, keine Instanz-
  // Leiste, kein Übersicht-/Verteilungs-Tab), "single-group" (Standard, 2
  // Instanzen an einem gemeinsamen Netzsensor) und "multi-group" (zusätzlich
  // eine dritte Instanz an einem zweiten Netzsensor — einzige Möglichkeit,
  // die Mehr-Gruppen-Navigation ohne zweiten physischen Smartmeter zu sehen).
  // ?multigroup=1 bleibt als Alias für ältere Links auf multi-group erhalten.
  const params = new URLSearchParams(location.search);
  const SCENARIOS = ["single", "single-group", "multi-group"];
  let SCENARIO = params.get("scenario");
  if (!SCENARIOS.includes(SCENARIO)) {
    SCENARIO = params.get("multigroup") === "1" ? "multi-group" : "single-group";
  }

  // Demo-Instanzen — Verteilung/Übersicht-Tab erscheint nur bei >1 Instanz.
  // SOC-Werte bewusst so gewählt, dass ein Kapazitätssensor-Tippfehler zu SOC-Divergenz führt.
  const INSTANCES = {
    demo_a: {
      name: "Solakon A",
      grid_sensor: "sensor.shelly_3em_leistung",
      settings: { ...DEFAULT_SETTINGS, tariff_enabled: true, tariff_price_sensor: "sensor.tibber_price_current" },
      status: mkStatus({ zone: 1, soc: 58, actual_power: 110, grid: -5, active_fall: "A", cycle_active: true }),
    },
    ...(SCENARIO !== "single" ? {
      demo_b: {
        name: "Solakon B",
        grid_sensor: "sensor.shelly_3em_leistung",
        settings: { ...DEFAULT_SETTINGS, surplus_enabled: true, surplus_forecast_enabled: true, pv_forecast_sensor: "sensor.solcast_prognose", surplus_lock_enabled: true, surplus_lock_sensor: "sensor.solcast_leistung_jetzt" },
        status: mkStatus({ zone: 1, soc: 81, actual_power: 140, grid: 8, active_fall: "A", cycle_active: true }),
      },
    } : {}),
    ...(SCENARIO === "multi-group" ? {
      demo_c: {
        name: "Solakon C (Netz West)",
        grid_sensor: "sensor.shelly_west_leistung",
        settings: { ...DEFAULT_SETTINGS },
        status: mkStatus({ zone: 0, soc: 97, actual_power: 300, grid: -3, active_fall: "0A", cycle_active: false }),
      },
    } : {}),
  };

  function mkStatus(o) {
    return {
      zone: o.zone, zone_label: `Zone ${o.zone}`, mode_label: "INV Discharge PV Priority",
      last_action: "Output → " + o.actual_power + " W", last_action_ts: now() - 12,
      last_output_ts: now() - 12, mode_label_ts: now() - 340,
      last_error: null, integral: 4.2, grid: o.grid, actual_power: o.actual_power,
      solar: 850, soc: o.soc, cycle_active: o.cycle_active, surplus_active: false,
      ac_charge: false, tariff_charge: false, regulation_enabled: true, stddev: 8.4,
      dyn_z1_enabled: false, dyn_z2_enabled: false, dyn_ac_enabled: false,
      dyn_z1: 0, dyn_z2: 0, dyn_ac: 0, active_fall: o.active_fall, is_night: false,
      forecast_tariff_suppressed: false, forecast_surplus_forced: false, forecast_exit_lock: false, allocated_power: 400,
    };
  }

  // Demo-Entities für die Live-Validierungspunkte (grün/gelb/rot) an Entity-Feldern.
  const STATES = {
    "sensor.solakon_one_leistung":            { state: "120",  attributes: { unit_of_measurement: "W", friendly_name: "Solakon ONE Leistung" } },
    "sensor.solakon_one_pv_leistung":          { state: "850",  attributes: { unit_of_measurement: "W", friendly_name: "Solakon ONE PV-Leistung" } },
    "sensor.solakon_one_batterie_ladestand":   { state: "72",   attributes: { unit_of_measurement: "%", friendly_name: "Solakon ONE Batterie-Ladestand" } },
    "sensor.solakon_one_batteriekapazitat":    { state: "10.5", attributes: { unit_of_measurement: "kWh", friendly_name: "Solakon ONE Batteriekapazität" } },
    "sensor.tibber_price_current":             { state: "0.28", attributes: { unit_of_measurement: "EUR/kWh", friendly_name: "Tibber Preis aktuell" } },
    "sensor.solcast_prognose":                 { state: "unavailable", attributes: { friendly_name: "Solcast PV-Prognose" } },
    "sensor.solcast_leistung_jetzt":           { state: "1450", attributes: { unit_of_measurement: "W", friendly_name: "Solcast Leistung jetzt" } },
    "sensor.shelly_3em_leistung":               { state: "3",    attributes: { unit_of_measurement: "W", friendly_name: "Shelly 3EM Leistung (Netz Ost)" } },
    "sensor.shelly_west_leistung":              { state: "-3",   attributes: { unit_of_measurement: "W", friendly_name: "Shelly Leistung (Netz West)" } },
    // sensor.solakon_one_batteriekapzitat (Tippfehler, Instanz B) existiert absichtlich nicht → roter Punkt
  };

  // Verteilungs-Config nach grid_power_sensor-Gruppe verschachtelt ({groupKey: {...}}).
  // Gruppe "sensor.shelly_3em_leistung": Kapazitätsausgleich aktiv, ein Sensor
  // korrekt (Instanz A), einer vertippt (Instanz B). Bei "single" keine
  // Verteilungs-Config nötig — der Verteilungs-Tab existiert dann gar nicht.
  let distConfig = SCENARIO === "single" ? {} : {
    "sensor.shelly_3em_leistung": {
      global_max_power: 800,
      distribution_mode: "weighted",
      capacity_weighting: true,
      inst_demo_a_capacity_sensor: "sensor.solakon_one_batteriekapazitat",
      inst_demo_b_capacity_sensor: "sensor.solakon_one_batteriekapzitat",
      global_pv_forecast_today_sensor: "",
      global_pv_forecast_tomorrow_sensor: "",
      global_surplus_lock_sensor: "",
      global_tariff_price_sensor: "",
      global_tariff_cheap_entity: "",
      global_tariff_exp_entity: "",
    },
    ...(SCENARIO === "multi-group" ? {
      "sensor.shelly_west_leistung": {
        global_max_power: 800,
        distribution_mode: "equal",
      },
    } : {}),
  };

  const hass = {
    language: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "de",
    states: STATES,
    callWS(msg) {
      const type = msg.type.slice(DOMAIN.length + 1);
      const inst = msg.entry_id ? INSTANCES[msg.entry_id] : null;
      switch (type) {
        case "get_all_instances":
          return Promise.resolve({ instances: Object.entries(INSTANCES).map(([entry_id, v]) => ({ entry_id, instance_name: v.name, grid_sensor: v.grid_sensor })) });
        case "get_config":
          return Promise.resolve({ ...inst.settings });
        case "save_config":
          Object.assign(inst.settings, msg.changes);
          return Promise.resolve({ success: true });
        case "get_status":
          return Promise.resolve({ ...inst.status });
        case "reset_integral":
          inst.status.integral = 0;
          return Promise.resolve({ success: true });
        case "set_cycle":
          inst.status.cycle_active = msg.active;
          return Promise.resolve({ success: true });
        case "get_distribution_config":
          return Promise.resolve({ distribution: { ...(distConfig[msg.grid_sensor] || {}) } });
        case "save_distribution_config":
          distConfig[msg.grid_sensor] = { ...msg.distribution };
          return Promise.resolve({ success: true });
        default:
          return Promise.reject(new Error("Demo-Vorschau: unbekannter WS-Typ " + msg.type));
      }
    },
  };

  document.getElementById("panel").hass = hass;

  // Szenario-Schalter unten rechts — navigiert per URL-Parameter (statt Live-
  // Hotswap), damit das Panel jedes Mal sauber mit neuem Startzustand lädt.
  const SCENARIO_LABELS = {
    single: "1 Instanz", "single-group": "2 Instanzen, 1 Gruppe", "multi-group": "3 Instanzen, 2 Gruppen",
  };
  const switcher = document.getElementById("scenario-switcher");
  for (const s of SCENARIOS) {
    const btn = document.createElement("button");
    btn.textContent = SCENARIO_LABELS[s];
    if (s === SCENARIO) btn.className = "active";
    btn.addEventListener("click", () => {
      const p = new URLSearchParams(location.search);
      p.set("scenario", s);
      p.delete("multigroup");
      location.search = p.toString();
    });
    switcher.appendChild(btn);
  }
})();
</script>
