<meta charset="utf-8">
<title>Solakon ONE — Live-Vorschau</title>
<style>
:root {
  color-scheme: dark;
  --primary-color: #03a9f4;
  --primary-background-color: #121212;
  --secondary-background-color: #1c1c1c;
  --card-background-color: #1e1e1e;
  --primary-text-color: #e0e0e0;
  --secondary-text-color: #a0a0a0;
  --divider-color: #333333;
  --app-header-background-color: #03a9f4;
  --app-header-text-color: #ffffff;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --primary-background-color: #fafafa;
    --secondary-background-color: #f0f0f0;
    --card-background-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #666666;
    --divider-color: #dddddd;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--primary-background-color);min-height:100vh}
#scenario-switcher{position:fixed;bottom:12px;right:12px;z-index:1000;display:flex;gap:4px;
  background:var(--card-background-color);border:1px solid var(--divider-color);
  border-radius:8px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-family:sans-serif}
#scenario-switcher button{border:none;border-radius:6px;padding:6px 10px;font-size:.78em;
  cursor:pointer;background:transparent;color:var(--secondary-text-color)}
#scenario-switcher button.active{background:var(--primary-color);color:#fff}
#scenario-switcher button:hover:not(.active){background:var(--secondary-background-color)}
</style>

<!--
  Live-Vorschau: lädt das echte solakon-panel.js unverändert und speist es mit
  Demo-Daten über ein Mock-hass-Objekt. Keine hartkodierte Nachbildung mehr —
  jede Änderung am echten Panel erscheint hier automatisch. Optional ?lang=en
  für die englische Übersetzung (real genutzte panel.en.json), ?scenario=
  wählt eine der drei Instanz-Konfigurationen (siehe Schalter unten rechts).
-->
<solakon-panel id="panel"></solakon-panel>
<div id="scenario-switcher"></div>

<script src="custom_components/solakon_nulleinspeisung/frontend/solakon-panel.js"></script>
<script>
(function () {
  const DOMAIN = "solakon_nulleinspeisung";

  // Kein HA-Server: die Static-Paths des Panels (/<DOMAIN>/panel.xx.json,
  // /<DOMAIN>/entity.xx.json) auf die repo-relativen Pfade umleiten — lokal über
  // `python -m http.server` wie auf GitHub Pages.
  const origFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => {
    if (typeof url === "string" && url.startsWith(`/${DOMAIN}/`)) {
      const datei = url.slice(DOMAIN.length + 2);
      const entity = datei.match(/^entity\.(de|en)\.json$/);
      url = entity
        ? `custom_components/${DOMAIN}/translations/${entity[1]}.json`
        : `custom_components/${DOMAIN}/frontend/${datei}`;
    }
    return origFetch(url, opts);
  };

  const now = () => Math.floor(Date.now() / 1000);

  // Antwort von get_schema, abgeglichen in tests/test_panel_schema.py.
  // SCHEMA-BEGIN
  const SCHEMA = {"settings":{"regulation_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"p_factor":{"default":1.3,"kind":"float","min":0,"max":null,"ui":[0.1,5,0.1],"choices":[]},"i_factor":{"default":0.05,"kind":"float","min":0,"max":null,"ui":[0,0.5,0.01],"choices":[]},"tolerance":{"default":15,"kind":"int","min":0,"max":null,"ui":[0,200,1],"choices":[]},"wait_time":{"default":3,"kind":"int","min":0,"max":null,"ui":[0,30,1],"choices":[]},"stddev_window":{"default":60,"kind":"int","min":0,"max":null,"ui":[30,300,10],"choices":[]},"stddev_trim_count":{"default":0,"kind":"int","min":0,"max":null,"ui":[0,10,1],"choices":[]},"zone1_limit":{"default":50,"kind":"int","min":0,"max":100,"ui":[0,100,1],"choices":[]},"zone3_limit":{"default":20,"kind":"int","min":0,"max":100,"ui":[0,100,1],"choices":[]},"discharge_max":{"default":40,"kind":"int","min":0,"max":40,"ui":[1,100,1],"choices":[]},"hard_limit_z0":{"default":800,"kind":"int","min":0,"max":1200,"ui":[100,1200,50],"choices":[]},"hard_limit_z1":{"default":800,"kind":"int","min":0,"max":1200,"ui":[100,1200,50],"choices":[]},"offset_1":{"default":30,"kind":"int","min":null,"max":null,"ui":[-200,300,1],"choices":[]},"offset_2":{"default":10,"kind":"int","min":null,"max":null,"ui":[-200,300,1],"choices":[]},"pv_reserve":{"default":50,"kind":"int","min":0,"max":null,"ui":[0,500,10],"choices":[]},"surplus_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"surplus_soc_threshold":{"default":95,"kind":"int","min":0,"max":100,"ui":[0,100,1],"choices":[]},"surplus_soc_hyst":{"default":5,"kind":"int","min":0,"max":100,"ui":[1,20,1],"choices":[]},"surplus_pv_hyst":{"default":50,"kind":"int","min":0,"max":null,"ui":[10,200,10],"choices":[]},"surplus_forecast_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"surplus_forecast_threshold":{"default":15.0,"kind":"float","min":0,"max":null,"ui":[0,100,0.5],"choices":[]},"surplus_lock_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"surplus_lock_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"surplus_lock_factor":{"default":1.5,"kind":"float","min":0,"max":null,"ui":[1.0,3.0,0.1],"choices":[]},"ac_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"ac_soc_target":{"default":90,"kind":"int","min":0,"max":100,"ui":[0,100,1],"choices":[]},"ac_power_limit":{"default":800,"kind":"int","min":0,"max":1200,"ui":[100,1200,50],"choices":[]},"ac_hysteresis":{"default":50,"kind":"int","min":0,"max":null,"ui":[10,500,10],"choices":[]},"ac_offset":{"default":-50,"kind":"int","min":null,"max":null,"ui":[-500,200,5],"choices":[]},"tariff_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"tariff_price_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"tariff_cheap_threshold":{"default":10.0,"kind":"float","min":null,"max":null,"ui":[0,100,0.5],"choices":[]},"tariff_exp_threshold":{"default":25.0,"kind":"float","min":null,"max":null,"ui":[0,100,0.5],"choices":[]},"tariff_soc_target":{"default":90,"kind":"int","min":0,"max":100,"ui":[0,100,1],"choices":[]},"tariff_soc_hyst":{"default":3,"kind":"int","min":0,"max":100,"ui":[0,20,1],"choices":[]},"tariff_power":{"default":800,"kind":"int","min":0,"max":1200,"ui":[100,1200,50],"choices":[]},"tariff_cheap_entity":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"tariff_exp_entity":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"pv_forecast_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"pv_forecast_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"pv_forecast_threshold":{"default":15.0,"kind":"float","min":0,"max":null,"ui":[0,50,0.5],"choices":[]},"zone1_force_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"zone1_force_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"zone1_force_threshold":{"default":15.0,"kind":"float","min":0,"max":null,"ui":[0,50,0.5],"choices":[]},"zone1_force_min_soc":{"default":20,"kind":"int","min":0,"max":100,"ui":[0,100,1],"choices":[]},"night_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"night_hysteresis":{"default":0,"kind":"int","min":0,"max":null,"ui":[0,500,10],"choices":[]},"rest_in_discharge":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"periodic_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"periodic_interval":{"default":10,"kind":"int","min":1,"max":null,"ui":[5,300,5],"choices":[]},"self_adjust_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"self_adjust_tolerance":{"default":2,"kind":"int","min":0,"max":null,"ui":[1,50,1],"choices":[]},"dyn_z1_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"dyn_z1_min":{"default":30,"kind":"int","min":0,"max":null,"ui":[0,500,1],"choices":[]},"dyn_z1_max":{"default":250,"kind":"int","min":0,"max":null,"ui":[50,1000,10],"choices":[]},"dyn_z1_noise":{"default":15,"kind":"int","min":0,"max":null,"ui":[0,100,1],"choices":[]},"dyn_z1_factor":{"default":1.5,"kind":"float","min":0,"max":null,"ui":[0.5,5,0.1],"choices":[]},"dyn_z1_negative":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"dyn_z2_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"dyn_z2_min":{"default":30,"kind":"int","min":0,"max":null,"ui":[0,500,1],"choices":[]},"dyn_z2_max":{"default":250,"kind":"int","min":0,"max":null,"ui":[50,1000,10],"choices":[]},"dyn_z2_noise":{"default":15,"kind":"int","min":0,"max":null,"ui":[0,100,1],"choices":[]},"dyn_z2_factor":{"default":1.5,"kind":"float","min":0,"max":null,"ui":[0.5,5,0.1],"choices":[]},"dyn_z2_negative":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"dyn_ac_enabled":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]},"dyn_ac_min":{"default":30,"kind":"int","min":0,"max":null,"ui":[0,500,1],"choices":[]},"dyn_ac_max":{"default":250,"kind":"int","min":0,"max":null,"ui":[50,1000,10],"choices":[]},"dyn_ac_noise":{"default":15,"kind":"int","min":0,"max":null,"ui":[0,100,1],"choices":[]},"dyn_ac_factor":{"default":1.5,"kind":"float","min":0,"max":null,"ui":[0.5,5,0.1],"choices":[]},"dyn_ac_negative":{"default":false,"kind":"bool","min":null,"max":null,"ui":null,"choices":[]}},"distribution":{"global_max_power":{"default":800,"kind":"int","min":0,"max":null,"ui":[0,9600,10],"choices":[]},"distribution_mode":{"default":"equal","kind":"enum","min":null,"max":null,"ui":null,"choices":["equal","soc","capacity","soc_switch"]},"soc_switch_divergence":{"default":5,"kind":"int","min":0,"max":100,"ui":[1,50,1],"choices":[]},"global_pv_forecast_today_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"global_pv_forecast_tomorrow_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"global_surplus_lock_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"global_tariff_price_sensor":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"global_tariff_cheap_entity":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]},"global_tariff_exp_entity":{"default":"","kind":"str","min":null,"max":null,"ui":null,"choices":[]}}};
  // SCHEMA-END

  // Deckt sich mit SETTINGS_DEFAULTS in const.py.
  const DEFAULT_SETTINGS = {
    regulation_enabled: true,
    p_factor: 1.3, i_factor: 0.05, tolerance: 15, wait_time: 3, stddev_window: 60, stddev_trim_count: 0,
    zone1_limit: 50, zone3_limit: 20, discharge_max: 40,
    hard_limit_z0: 800, hard_limit_z1: 800,
    offset_1: 30, offset_2: 10, pv_reserve: 50,
    surplus_enabled: false, surplus_soc_threshold: 95, surplus_soc_hyst: 5, surplus_pv_hyst: 50,
    surplus_forecast_enabled: false, surplus_forecast_threshold: 5000,
    surplus_lock_enabled: false, surplus_lock_sensor: "", surplus_lock_factor: 1.5,
    ac_enabled: false, ac_soc_target: 90, ac_power_limit: 800, ac_hysteresis: 50,
    ac_offset: -50,
    tariff_enabled: false, tariff_price_sensor: "", tariff_cheap_threshold: 10, tariff_exp_threshold: 25,
    tariff_soc_target: 90, tariff_soc_hyst: 3, tariff_power: 800, tariff_cheap_entity: "", tariff_exp_entity: "",
    pv_forecast_enabled: false, pv_forecast_sensor: "", pv_forecast_threshold: 5000,
    zone1_force_enabled: false, zone1_force_sensor: "", zone1_force_threshold: 5000,
    night_enabled: false,
    periodic_enabled: false, periodic_interval: 10,
    self_adjust_enabled: false, self_adjust_tolerance: 2,
    dyn_z1_enabled: false, dyn_z1_min: 30, dyn_z1_max: 250, dyn_z1_noise: 15, dyn_z1_factor: 1.5, dyn_z1_negative: false,
    dyn_z2_enabled: false, dyn_z2_min: 30, dyn_z2_max: 250, dyn_z2_noise: 15, dyn_z2_factor: 1.5, dyn_z2_negative: false,
    dyn_ac_enabled: false, dyn_ac_min: 30, dyn_ac_max: 250, dyn_ac_noise: 15, dyn_ac_factor: 1.5, dyn_ac_negative: false,
  };

  // Szenario-Auswahl für die Live-Vorschau — deckt die drei strukturell
  // unterschiedlichen Panel-Zustände ab: "single" (1 Instanz, keine Instanz-
  // Leiste, kein Übersicht-/Verteilungs-Tab), "single-group" (Standard, 2
  // Instanzen an einem gemeinsamen Netzsensor) und "multi-group" (zusätzlich
  // eine dritte Instanz an einem zweiten Netzsensor — einzige Möglichkeit,
  // die Mehr-Gruppen-Navigation ohne zweiten physischen Smartmeter zu sehen).
  // ?multigroup=1 bleibt als Alias für ältere Links auf multi-group erhalten.
  const params = new URLSearchParams(location.search);
  const SCENARIOS = ["single", "single-group", "multi-group"];
  let SCENARIO = params.get("scenario");
  if (!SCENARIOS.includes(SCENARIO)) {
    SCENARIO = params.get("multigroup") === "1" ? "multi-group" : "single-group";
  }

  // Demo-Instanzen — Verteilung/Übersicht-Tab erscheint nur bei >1 Instanz.
  // SOC-Werte bewusst so gewählt, dass ein Kapazitätssensor-Tippfehler zu SOC-Divergenz führt.
  const INSTANCES = {
    demo_a: {
      name: "Solakon A",
      grid_sensor: "sensor.shelly_3em_leistung",
      settings: { ...DEFAULT_SETTINGS, tariff_enabled: true, tariff_price_sensor: "sensor.tibber_price_current" },
      status: mkStatus({ zone: 1, soc: 58, actual_power: 110, grid: -5, active_fall: "A", cycle_active: true }),
    },
    ...(SCENARIO !== "single" ? {
      demo_b: {
        name: "Solakon B",
        grid_sensor: "sensor.shelly_3em_leistung",
        settings: { ...DEFAULT_SETTINGS, surplus_enabled: true, surplus_forecast_enabled: true, pv_forecast_sensor: "sensor.solcast_prognose", surplus_lock_enabled: true, surplus_lock_sensor: "sensor.solcast_leistung_jetzt" },
        status: mkStatus({ zone: 1, soc: 81, actual_power: 140, grid: 8, active_fall: "A", cycle_active: true,
                           last_error: SCENARIO === "multi-group" ? "Kapazitätssensor nicht verfügbar" : null }),
      },
    } : {}),
    ...(SCENARIO === "multi-group" ? {
      demo_c: {
        name: "Solakon C (Netz West)",
        grid_sensor: "sensor.shelly_west_leistung",
        settings: { ...DEFAULT_SETTINGS },
        status: mkStatus({ zone: 0, soc: 97, actual_power: 300, grid: -3, active_fall: "0A", cycle_active: false,
                           regulation_enabled: false }),
      },
    } : {}),
  };

  // Bildet die Zustandsableitung aus coordinator.py::_update_operating_state()
  // nach, statt operating_state statisch zu hinterlegen — sonst zeigt die
  // Vorschau Zustände, die nicht zu den übrigen Flags der Karte passen.
  function mkOperatingState(o) {
    if (o.regulation_enabled === false) return "disabled";
    if (o.surplus_active)               return "exporting";
    if (o.tariff_charge)                return "tariff_charging";
    if (o.ac_charge)                    return "ac_charging";
    if (o.discharge_locked)             return "discharge_locked";
    if (o.is_night)                     return "night_off";
    if (o.cycle_active)                 return "battery_supply";
    if (o.zone === 3)                   return "safety_stop";
    return "pv_direct";
  }

  function mkStatus(o) {
    return {
      zone: o.zone, zone_label: `Zone ${o.zone}`, mode_label: "INV Discharge PV Priority",
      last_action: "Output → " + o.actual_power + " W", last_action_ts: now() - 12,
      last_output_ts: now() - 12, mode_label_ts: now() - 340,
      last_error: o.last_error ?? null, integral: 4.2, grid: o.grid, actual_power: o.actual_power,
      solar: 850, soc: o.soc, cycle_active: o.cycle_active, surplus_active: false,
      ac_charge: false, tariff_charge: false, regulation_enabled: o.regulation_enabled ?? true, stddev: 8.4, stddev_raw: 8.4,
      dyn_z1_enabled: false, dyn_z2_enabled: false, dyn_ac_enabled: false,
      dyn_z1: 0, dyn_z2: 0, dyn_ac: 0, active_fall: o.active_fall, is_night: false,
      operating_state: mkOperatingState(o), discharge_locked: o.discharge_locked ?? false,
      forecast_tariff_suppressed: false, forecast_surplus_forced: false, forecast_exit_lock: false, allocated_power: 400,
    };
  }

  // Bildet die Degradationslogik aus coordinator.py::_all_shares() nach, statt
  // dist_mode_effective statisch zu hinterlegen — sonst zeigt die Vorschau nach
  // einem Moduswechsel im Dropdown unmögliche Kombinationen (z. B. "equal"
  // "degradiert", was es im echten Backend gar nicht gibt). Wird bei jedem
  // get_status-Aufruf frisch aus dem aktuellen distConfig berechnet.
  function computeDistModeEffective(entryId) {
    const inst = INSTANCES[entryId];
    const gk = inst.grid_sensor;
    const groupIds = Object.entries(INSTANCES)
      .filter(([, v]) => v.grid_sensor === gk).map(([eid]) => eid);
    if (groupIds.length <= 1) return "equal";
    const cfg  = distConfig[gk] || {};
    const mode = cfg.distribution_mode || "equal";
    if (mode === "equal") return "equal"; // kein Degradationspfad im Backend
    if (mode === "capacity") {
      const allValid = groupIds.every(eid => {
        const capSensor = cfg[`inst_${eid}_capacity_sensor`];
        const st = capSensor ? STATES[capSensor] : null;
        return st && st.state !== "unknown" && st.state !== "unavailable" && !isNaN(parseFloat(st.state));
      });
      return allValid ? "capacity" : "soc";
    }
    // "soc"/"soc_switch": hängen im echten Backend zusätzlich von SOC-Sensor-
    // Verfügbarkeit ab — in der Vorschau immer gültig, da rein statische Werte.
    return mode;
  }

  // Bildet Offset- und Kapazitätsfelder aus coordinator.py::snapshot() nach —
  // bei jedem get_status frisch, damit Zyklus-Schalter, gespeicherte Offsets und
  // geänderte Kapazitätssensoren sofort in der Vorschau wirken.
  const OFFSET_SOURCES = {
    ac: ["dyn_ac_enabled", "ac_offset", "dyn_ac"],
    z1: ["dyn_z1_enabled", "offset_1", "dyn_z1"],
    z2: ["dyn_z2_enabled", "offset_2", "dyn_z2"],
  };
  const KWH_SCALE = { wh: 0.001, mwh: 1000 };
  function computeSnapshotExtras(entryId) {
    const inst = INSTANCES[entryId];
    const st = inst.status, s = inst.settings;
    const zone = st.ac_charge ? "ac" : st.cycle_active ? "z1" : "z2";
    const [enabledKey, staticKey, dynKey] = OFFSET_SOURCES[zone];
    const dynamic = !!s[enabledKey];
    const capSensor = (distConfig[inst.grid_sensor] || {})[`inst_${entryId}_capacity_sensor`];
    const capState = capSensor ? STATES[capSensor] : null;
    const unit = (capState?.attributes?.unit_of_measurement || "").trim().toLowerCase();
    const capKwh = capState ? parseFloat(capState.state) * (KWH_SCALE[unit] ?? 1) : NaN;
    return {
      offset_zone: zone, offset_dynamic: dynamic, offset_static: s[staticKey],
      offset_value: dynamic ? st[dynKey] : s[staticKey],
      capacity_kwh: Number.isFinite(capKwh) ? capKwh : null,
    };
  }

  // Demo-Entities für die Live-Validierungspunkte (grün/gelb/rot) an Entity-Feldern.
  const STATES = {
    "sensor.solakon_one_leistung":            { state: "120",  attributes: { unit_of_measurement: "W", friendly_name: "Solakon ONE Leistung" } },
    "sensor.solakon_one_pv_leistung":          { state: "850",  attributes: { unit_of_measurement: "W", friendly_name: "Solakon ONE PV-Leistung" } },
    "sensor.solakon_one_batterie_ladestand":   { state: "72",   attributes: { unit_of_measurement: "%", friendly_name: "Solakon ONE Batterie-Ladestand" } },
    "sensor.solakon_one_batteriekapazitat":    { state: "10.5", attributes: { unit_of_measurement: "kWh", friendly_name: "Solakon ONE Batteriekapazität" } },
    "sensor.tibber_price_current":             { state: "0.28", attributes: { unit_of_measurement: "EUR/kWh", friendly_name: "Tibber Preis aktuell" } },
    "sensor.solcast_prognose":                 { state: "unavailable", attributes: { friendly_name: "Solcast PV-Prognose" } },
    "sensor.solcast_leistung_jetzt":           { state: "1450", attributes: { unit_of_measurement: "W", friendly_name: "Solcast Leistung jetzt" } },
    "sensor.shelly_3em_leistung":               { state: "3",    attributes: { unit_of_measurement: "W", friendly_name: "Shelly 3EM Leistung (Netz Ost)" } },
    "sensor.shelly_west_leistung":              { state: "-3",   attributes: { unit_of_measurement: "W", friendly_name: "Shelly Leistung (Netz West)" } },
    // sensor.solakon_one_batteriekapzitat (Tippfehler, Instanz B) existiert absichtlich nicht → roter Punkt
  };

  // Verteilungs-Config nach grid_power_sensor-Gruppe verschachtelt ({groupKey: {...}}).
  // Gruppe "sensor.shelly_3em_leistung": Kapazitätsausgleich aktiv, ein Sensor
  // korrekt (Instanz A), einer vertippt (Instanz B). Bei "single" keine
  // Verteilungs-Config nötig — der Verteilungs-Tab existiert dann gar nicht.
  let distConfig = SCENARIO === "single" ? {} : {
    "sensor.shelly_3em_leistung": {
      global_max_power: 800,
      distribution_mode: "capacity",
      inst_demo_a_capacity_sensor: "sensor.solakon_one_batteriekapazitat",
      inst_demo_b_capacity_sensor: "sensor.solakon_one_batteriekapzitat",
      global_pv_forecast_today_sensor: "",
      global_pv_forecast_tomorrow_sensor: "",
      global_surplus_lock_sensor: "",
      global_tariff_price_sensor: "",
      global_tariff_cheap_entity: "",
      global_tariff_exp_entity: "",
    },
    ...(SCENARIO === "multi-group" ? {
      "sensor.shelly_west_leistung": {
        global_max_power: 800,
        distribution_mode: "equal",
      },
    } : {}),
  };

  const hass = {
    language: new URLSearchParams(location.search).get("lang") === "en" ? "en" : "de",
    states: STATES,
    areas: {
      verteiler_ost:  { area_id: "verteiler_ost",  name: "Stromverteiler Ost" },
      verteiler_west: { area_id: "verteiler_west", name: "Stromverteiler West" },
    },
    devices: {
      dev_shelly_west: { id: "dev_shelly_west", area_id: "verteiler_west" },
    },
    entities: {
      "sensor.shelly_3em_leistung":  { entity_id: "sensor.shelly_3em_leistung",  area_id: "verteiler_ost", device_id: null },
      "sensor.shelly_west_leistung": { entity_id: "sensor.shelly_west_leistung", area_id: null, device_id: "dev_shelly_west" },
    },
    callWS(msg) {
      const type = msg.type.slice(DOMAIN.length + 1);
      const inst = msg.entry_id ? INSTANCES[msg.entry_id] : null;
      switch (type) {
        case "get_all_instances":
          return Promise.resolve({ instances: Object.entries(INSTANCES).map(([entry_id, v]) => ({ entry_id, instance_name: v.name, grid_sensor: v.grid_sensor })) });
        case "get_schema":
          return Promise.resolve(JSON.parse(JSON.stringify(SCHEMA)));
        case "get_config":
          return Promise.resolve({ ...inst.settings });
        case "save_config":
          Object.assign(inst.settings, msg.changes);
          return Promise.resolve({ success: true });
        case "get_status":
          return Promise.resolve({
            ...inst.status, ...computeSnapshotExtras(msg.entry_id),
            dist_mode_effective: computeDistModeEffective(msg.entry_id),
          });
        case "reset_integral":
          inst.status.integral = 0;
          return Promise.resolve({ success: true });
        case "set_cycle":
          inst.status.cycle_active = msg.active;
          return Promise.resolve({ success: true });
        case "get_distribution_config":
          return Promise.resolve({ distribution: { ...(distConfig[msg.grid_sensor] || {}) } });
        case "save_distribution_config":
          distConfig[msg.grid_sensor] = { ...msg.distribution };
          return Promise.resolve({ success: true });
        default:
          return Promise.reject(new Error("Demo-Vorschau: unbekannter WS-Typ " + msg.type));
      }
    },
  };

  document.getElementById("panel").hass = hass;

  // Szenario-Schalter unten rechts — navigiert per URL-Parameter (statt Live-
  // Hotswap), damit das Panel jedes Mal sauber mit neuem Startzustand lädt.
  const SCENARIO_LABELS = {
    single: "1 Instanz", "single-group": "2 Instanzen, 1 Gruppe", "multi-group": "3 Instanzen, 2 Gruppen",
  };
  const switcher = document.getElementById("scenario-switcher");
  for (const s of SCENARIOS) {
    const btn = document.createElement("button");
    btn.textContent = SCENARIO_LABELS[s];
    if (s === SCENARIO) btn.className = "active";
    btn.addEventListener("click", () => {
      const p = new URLSearchParams(location.search);
      p.set("scenario", s);
      p.delete("multigroup");
      location.search = p.toString();
    });
    switcher.appendChild(btn);
  }
})();
</script>
